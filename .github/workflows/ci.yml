name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      # Только компиляция: gui.py импортирует winreg и customtkinter,
      # поэтому реальный импорт на Linux-раннере невозможен.
      - name: Byte-compile
        run: python -m compileall -q gui.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      # настоящий запуск окна: стартовый экран и анимации без исключений
      - name: GUI smoke test
        run: python tests/smoke_gui.py

      - name: Stop-before-update test
        run: python tests/stop_test.py
